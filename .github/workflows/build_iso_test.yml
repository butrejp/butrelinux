name: Build Butrelinux ISO test

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    env:
      IMAGES: "hwe nvidia lto-hwe lto-nvidia"

    steps:
      - name: Set build date
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman xorriso

      - name: Generate installer configurations
        run: |
          set -eu
          mkdir -p generated-kickstarts

          menu_entries=""
          for image in $IMAGES; do
            echo "Generating kickstart for ${image}..."
            sed "s|@IMAGE@|${image}|g" kickstarts/base.cfg \
              > "generated-kickstarts/${image}.cfg"

            menu_entries="${menu_entries}
          menuentry 'Install butrelinux-${image}' --class fedora --class gnu-linux --class gnu --class os {
              linux (\$root)\$kernel_path \$common_args inst.ks=hd:LABEL=BUTRELINUX:/${image}.cfg
              initrd (\$root)\$initrd_path
          }"
          done

          printf '%s\n' "$menu_entries" > generated-menu-entries.cfg

          awk '
            /@MENU_ENTRIES@/ {
              while ((getline line < "generated-menu-entries.cfg") > 0)
                print line
              close("generated-menu-entries.cfg")
              next
            }
            { print }
          ' boot/grub.cfg > generated-grub.cfg

          echo "Generated GRUB configuration:"
          cat generated-grub.cfg

      - name: Download base ISO
        run: |
          mkdir -p results
          curl -fL -o cs10-boot.iso \
            "https://mirror.stream.centos.org/10-stream/BaseOS/x86_64/iso/CentOS-Stream-10-latest-x86_64-boot.iso"

      - name: Generate Base Installer ISO
        run: |
          set -eu
          sudo podman run --rm --privileged \
            -v /dev:/dev \
            -v "$GITHUB_WORKSPACE:/work:z" \
            quay.io/centos/centos:stream10 \
            /bin/bash -c \
              "dnf install -y lorax && \
               mkksiso \
                 /work/generated-kickstarts/hwe.cfg \
                 /work/cs10-boot.iso \
                 /work/results/base.iso"
          
          # Fix ownership so the next (non-sudo) step can read the ISO
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/results"

      - name: Fix embedded EFI boot image for DD mode
        run: |
          set -eu
          sudo apt-get install -y mtools

          xorriso -indev results/base.iso \
            -osirrox on \
            -extract /images/efiboot.img /tmp/efiboot.img

          export MTOOLS_SKIP_CHECK=1

          mcopy -o -i /tmp/efiboot.img generated-grub.cfg ::/EFI/BOOT/grub.cfg
          mcopy -o -i /tmp/efiboot.img generated-grub.cfg ::/EFI/BOOT/grub2.cfg || true

      - name: Inject Configurations
        run: |
          set -eu

          XISO=(
            xorriso
            -indev results/base.iso
            -outdev "results/butrelinux-unified-${BUILD_DATE}.iso"
            -volid "BUTRELINUX"
            -boot_image any replay
          )

          for image in $IMAGES; do
            echo "Injecting ${image}.cfg..."
            XISO+=(
              -map
              "generated-kickstarts/${image}.cfg"
              "/${image}.cfg"
            )
          done

          XISO+=(
            -update /tmp/efiboot.img /images/efiboot.img
            -update generated-grub.cfg /EFI/BOOT/grub.cfg
            -map generated-grub.cfg /EFI/BOOT/grub2.cfg
            -update generated-grub.cfg /boot/grub2/grub.cfg
          )

          echo "Running xorriso..."
          "${XISO[@]}"

      - name: Cleanup intermediate files
        if: always()
        run: rm -f cs10-boot.iso results/base.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: butrelinux-unified-${{ env.BUILD_DATE }}
          path: ./results/butrelinux-unified-${{ env.BUILD_DATE }}.iso
          archive: false
          retention-days: 14
          if-no-files-found: error