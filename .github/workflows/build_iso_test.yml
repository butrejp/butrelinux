name: Build butrelinux ISO - test

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ env.BUILD_DATE }}

    env:
      IMAGES: "hwe nvidia lto-hwe lto-nvidia"
      MIRROR: "https://mirror.stream.centos.org/10-stream/BaseOS/x86_64/os"

    steps:
      - name: Set build date
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools dosfstools syslinux-utils

      - name: Download base ISO and EFI image
        run: |
          mkdir -p results
          curl -fL -o cs10-boot.iso \
            "${MIRROR}/images/boot.iso"
          curl -fL -o cs10-efiboot.img \
            "${MIRROR}/images/efiboot.img"

      - name: Extract base ISO contents
        run: |
          set -eu
          mkdir -p iso-root
          xorriso -osirrox on -indev cs10-boot.iso -extract / iso-root/
          
          echo "=== Top-level contents ==="
          ls -la iso-root/
          
          echo "=== Boot-related files ==="
          find iso-root -maxdepth 3 \( -name "*.bin" -o -name "*.img" -o -name "grub.cfg" -o -name "grub2.cfg" \) -ls || true

      - name: Generate installer configurations
        run: |
          set -eu
          mkdir -p generated-kickstarts

          menu_entries=""
          for image in $IMAGES; do
            echo "Generating kickstart for ${image}..."
            sed "s|@IMAGE@|${image}|g" kickstarts/base.cfg \
              > "generated-kickstarts/${image}.cfg"

            menu_entries="${menu_entries}
          menuentry 'Install butrelinux-${image}' --class fedora --class gnu-linux --class gnu --class os {
              linux (\$root)\$kernel_path \$common_args inst.ks=hd:LABEL=BUTRELINUX:/${image}.cfg
              initrd (\$root)\$initrd_path
          }"
          done

          printf '%s\n' "$menu_entries" > generated-menu-entries.cfg

          awk '
            /@MENU_ENTRIES@/ {
              while ((getline line < "generated-menu-entries.cfg") > 0)
                print line
              close("generated-menu-entries.cfg")
              next
            }
            { print }
          ' boot/grub.cfg > generated-grub.cfg

          echo "=== Generated GRUB configuration ==="
          cat generated-grub.cfg

      - name: Inject configs into ISO tree
        run: |
          set -eu
          
          for image in $IMAGES; do
            cp "generated-kickstarts/${image}.cfg" "iso-root/${image}.cfg"
          done
          
          mkdir -p iso-root/EFI/BOOT iso-root/boot/grub2
          cp generated-grub.cfg iso-root/EFI/BOOT/grub.cfg
          cp generated-grub.cfg iso-root/EFI/BOOT/grub2.cfg || true
          cp generated-grub.cfg iso-root/boot/grub2/grub.cfg

      - name: Build modified EFI boot image
        run: |
          set -eu
          
          cp cs10-efiboot.img /tmp/efiboot.img
          
          export MTOOLS_SKIP_CHECK=1
          mcopy -o -i /tmp/efiboot.img generated-grub.cfg ::/EFI/BOOT/grub.cfg
          mcopy -o -i /tmp/efiboot.img generated-grub.cfg ::/EFI/BOOT/grub2.cfg || true
          
          mkdir -p iso-root/images
          cp /tmp/efiboot.img iso-root/images/efiboot.img
          
          echo "=== Modified EFI image ==="
          ls -lh /tmp/efiboot.img iso-root/images/efiboot.img

      - name: Build unified hybrid ISO
        run: |
          set -eu
          
          iso_out="results/butrelinux-unified-${BUILD_DATE}.iso"
          
          MKISOFS=(
            xorriso -as mkisofs
            -r
            -V "BUTRELINUX"
            -J
            -joliet-long
            -partition_offset 16
          )
          
          if [ -f iso-root/isolinux/isolinux.bin ]; then
            echo "Adding BIOS boot support..."
            MKISOFS+=(
              -b isolinux/isolinux.bin
              -c isolinux/boot.cat
              -no-emul-boot
              -boot-load-size 4
              -boot-info-table
            )
            if [ -f /usr/lib/ISOLINUX/isohdpfx.bin ]; then
              MKISOFS+=(-isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin)
            elif [ -f /usr/share/syslinux/isohdpfx.bin ]; then
              MKISOFS+=(-isohybrid-mbr /usr/share/syslinux/isohdpfx.bin)
            fi
          fi
          
          MKISOFS+=(
            -append_partition 2 0xef /tmp/efiboot.img
            -appended_part_as_gpt
            -eltorito-alt-boot
            -e --interval:appended_partition_2:all::
            -no-emul-boot
            -o "$iso_out"
            iso-root/
          )
          
          echo "=== Building ISO ==="
          printf '%s\n' "${MKISOFS[*]}"
          "${MKISOFS[@]}"
          
          sudo chown -R "$(id -u):$(id -g)" results

      - name: Verify ISO
        run: |
          set -eu
          iso="results/butrelinux-unified-${BUILD_DATE}.iso"
          
          echo "=== File info ==="
          ls -lh "$iso"
          
          echo -e "\n=== El Torito boot images ==="
          xorriso -indev "$iso" -report_el_torito plain 2>&1 || true
          
          echo -e "\n=== Partition table ==="
          fdisk -l "$iso" 2>&1 || true
          
          echo -e "\n=== GPT partitions ==="
          sgdisk -p "$iso" 2>&1 || true
          
          echo -e "\n=== Verify kickstarts in ISO filesystem ==="
          for image in $IMAGES; do
            xorriso -indev "$iso" -ls "/${image}.cfg" 2>&1 || true
          done
          
          echo -e "\n=== Verify GRUB config in ISO filesystem ==="
          xorriso -indev "$iso" -cat /EFI/BOOT/grub.cfg 2>&1 | head -20 || true
          
          echo -e "\n=== Extract and verify appended ESP partition (DD mode) ==="
          part_start=$(sgdisk -p "$iso" 2>/dev/null | awk '/^   2 / {print $2}')
          part_size=$(sgdisk -p "$iso" 2>/dev/null | awk '/^   2 / {print $3 - $2 + 1}')
          if [ -n "$part_start" ] && [ -n "$part_size" ]; then
            dd if="$iso" of=/tmp/extracted-esp.img bs=512 skip="$part_start" count="$part_size" status=none
            mcopy -i /tmp/extracted-esp.img ::/EFI/BOOT/grub.cfg /tmp/verify-dd-grub.cfg
            echo "--- DD-mode GRUB config (first 20 lines) ---"
            head -20 /tmp/verify-dd-grub.cfg
            diff -u generated-grub.cfg /tmp/verify-dd-grub.cfg && echo "DD-mode GRUB config: MATCH"
          else
            echo "WARNING: Could not extract partition 2 for verification"
          fi

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: butrelinux-unified-${{ env.BUILD_DATE }}
          path: ./results/butrelinux-unified-${{ env.BUILD_DATE }}.iso
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup intermediate files
        if: always()
        run: rm -rf cs10-boot.iso cs10-efiboot.img iso-root /tmp/efiboot.img /tmp/extracted-esp.img /tmp/verify-dd-grub.cfg generated-kickstarts generated-menu-entries.cfg generated-grub.cfg

  boot-test:
    name: Boot Test ${{ matrix.variant }}
    needs: build-iso
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [hwe, nvidia, lto-hwe, lto-nvidia]
    steps:
      - uses: actions/checkout@v7

      - name: Install QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso qemu-utils

      - name: Download ISO artifact
        uses: actions/download-artifact@v7
        with:
          name: butrelinux-unified-${{ needs.build-iso.outputs.build_date }}
          path: ./iso

      - name: Locate ISO
        run: |
          ISO=$(find ./iso -name "*.iso" | head -n1)
          echo "ISO=$ISO" >> "$GITHUB_ENV"
          ls -lh "$ISO"

      - name: Extract kernel & initrd
        run: |
          mkdir -p pxeboot
          xorriso -osirrox on -indev "$ISO" -extract /images/pxeboot pxeboot/
          file pxeboot/vmlinuz pxeboot/initrd.img

      - name: Create test disk
        run: qemu-img create -f raw test-disk.raw 10G

      - name: Boot ${{ matrix.variant }} in QEMU
        run: |
          set +e
          timeout 120 qemu-system-x86_64 \
            -m 4096 -smp 2 -cpu qemu64 -nographic \
            -bios /usr/share/ovmf/OVMF.fd \
            -cdrom "$ISO" \
            -drive file=test-disk.raw,format=raw,if=virtio \
            -kernel pxeboot/vmlinuz \
            -initrd pxeboot/initrd.img \
            -append "inst.stage2=hd:LABEL=BUTRELINUX inst.ks=hd:LABEL=BUTRELINUX:/${{ matrix.variant }}.cfg console=ttyS0,115200n8 inst.noverifssl rd.live.ram=1" \
            2>&1 | tee boot.log
          set -e

      - name: Analyze boot log
        run: |
          tail -n 200 boot.log
          if grep -qiE "kernel panic|VFS:.*unable to mount root|error: file .*not found|grub rescue>" boot.log; then
            echo "FAIL: Critical boot error"
            exit 1
          fi
          if grep -qE "dracut:|Starting installer|anaconda|Reached target .*Network" boot.log; then
            echo "PASS: Boot OK for ${{ matrix.variant }}"
          else
            echo "FAIL: No boot indicators"
            exit 1
          fi

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-log-${{ matrix.variant }}
          path: boot.log
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -f test-disk.raw boot.log
        