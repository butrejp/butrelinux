name: Build butrelinux Unified ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Set build date
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ISO tools
        run: sudo apt-get update && sudo apt-get install -y xorriso mtools

      - name: Prepare results directory
        run: mkdir -p $GITHUB_WORKSPACE/results

      - name: Download CentOS Stream 10 Base ISO
        run: curl -L -o cs10-boot.iso "https://mirror.stream.centos.org/10-stream/BaseOS/x86_64/iso/CentOS-Stream-10-latest-x86_64-boot.iso"

      - name: Inject Cosign Public Key into Kickstarts
        run: |
          cp kickstarts/hwe.cfg hwe-injected.cfg
          cp kickstarts/nvidia.cfg nvidia-injected.cfg
          sed -i '/PLACEHOLDER_PUBKEY/r cosign.pub' hwe-injected.cfg
          sed -i '/PLACEHOLDER_PUBKEY/d' hwe-injected.cfg
          sed -i '/PLACEHOLDER_PUBKEY/r cosign.pub' nvidia-injected.cfg
          sed -i '/PLACEHOLDER_PUBKEY/d' nvidia-injected.cfg

      - name: Stage and Patch ISO
        run: |
          mkdir -p iso_content
          xorriso -osirrox on -indev cs10-boot.iso -extract / iso_content/
          cp hwe-injected.cfg iso_content/hwe.cfg
          cp nvidia-injected.cfg iso_content/nvidia.cfg
          cp boot/grub.cfg iso_content/EFI/BOOT/grub.cfg
          cp boot/grub.cfg iso_content/boot/grub2/grub.cfg
          mcopy -D o -i iso_content/images/efiboot.img boot/grub.cfg ::/EFI/BOOT/grub.cfg
          
      - name: Generate Unified ISO
        run: |
          xorriso -as mkisofs \
            -o $GITHUB_WORKSPACE/results/butrelinux-unified-${{ env.BUILD_DATE }}.iso \
            -volid "BUTRELINUX" \
            -eltorito-boot images/efiboot.img \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot images/efiboot.img -efi-boot-part --efi-boot-image --protective-msdos-label \
            iso_content

      - name: Upload Unified ISO
        uses: actions/upload-artifact@v7
        with:
          name: butrelinux-unified-iso
          path: ./results/butrelinux-unified-${{ env.BUILD_DATE }}.iso
          retention-days: 14
          if-no-files-found: error