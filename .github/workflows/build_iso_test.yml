name: Build Butrelinux ISO test

permissions:
  contents: write

on:
  workflow_dispatch:


jobs:
  build-iso:
    runs-on: ubuntu-latest

    env:
      IMAGES: "hwe nvidia lto-hwe lto-nvidia"

    steps:
      - name: Set build date
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman xorriso

      - name: Generate installer configurations
        run: |
          set -eu

          mkdir -p generated-kickstarts

          menu_entries=""

          for image in $IMAGES; do
            echo "Generating kickstart for ${image}..."

            sed "s|@IMAGE@|${image}|g" \
              kickstarts/base.cfg \
              > "generated-kickstarts/${image}.cfg"

            menu_entries="${menu_entries}
          menuentry 'Install butrelinux-${image}' --class fedora --class gnu-linux --class gnu --class os {
              linux (\$root)\$kernel_path \$common_args inst.ks=hd:LABEL=BUTRELINUX:/${image}.cfg
              initrd (\$root)\$initrd_path
          }"
          done

          printf '%s\n' "$menu_entries" > generated-menu-entries.cfg

          awk '
            /@MENU_ENTRIES@/ {
              while ((getline line < "generated-menu-entries.cfg") > 0)
                print line
              close("generated-menu-entries.cfg")
              next
            }
            { print }
          ' boot/grub.cfg > generated-grub.cfg

          echo "Generated GRUB configuration:"
          cat generated-grub.cfg

      - name: Generate Unified Installer ISO
        run: |
          set -eu

          mkdir -p "$GITHUB_WORKSPACE/results"

          # 1. Fetch the official CentOS Stream 10 minimal network boot installer
          curl -L -o cs10-boot.iso \
            "https://mirror.stream.centos.org/10-stream/BaseOS/x86_64/iso/CentOS-Stream-10-latest-x86_64-boot.iso"


          sudo podman run --rm --privileged \
            -v /dev:/dev \
            -v "$GITHUB_WORKSPACE:/work:z" \
            quay.io/centos/centos:stream10 \
            /bin/bash -c "
              dnf install -y lorax && \
              
              
              mkdir -p /tmp/iso_mount /tmp/iso_work
              mount -o loop /work/cs10-boot.iso /tmp/iso_mount
              cp -a /tmp/iso_mount/. /tmp/iso_work/
              umount /tmp/iso_mount
              

              for image in ${IMAGES}; do
                echo 'Embedding kickstart for '\${image}' into the layout root...'
                cp /work/generated-kickstarts/\${image}.cfg /tmp/iso_work/\${image}.cfg
              done
              
              echo 'Applying your GRUB layout changes...'
              cp /work/generated-grub.cfg /tmp/iso_work/EFI/BOOT/grub.cfg
              cp /work/generated-grub.cfg /tmp/iso_work/EFI/BOOT/grub2.cfg
              
              # Re-compile the hybrid ISO out to your output directory
              echo 'Generating DD safe ISO image structure...'
              mkksiso \
                -V 'BUTRELINUX' \
                /work/generated-kickstarts/hwe.cfg \
                /tmp/iso_work \
                /work/results/butrelinux-unified-${BUILD_DATE}.iso
            "


      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: butrelinux-unified-${{ env.BUILD_DATE }}
          path: ./results/butrelinux-unified-${{ env.BUILD_DATE }}.iso
          retention-days: 14
          if-no-files-found: error
