name: Build ButreLinux ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream10
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          dnf -y install epel-release
          dnf -y install podman skopeo rpm-ostree lorax createrepo_c sudo passwd shadow-utils systemd anaconda anaconda-install-env-deps
          dnf clean all

      - name: Prepare container storage (tmpfs)
        run: |
          mkdir -p /var/lib/containers
          mount -t tmpfs -o size=30G tmpfs /var/lib/containers

      - name: Extract OSTree repo from container image
        run: |
          mkdir -p /ostree-repo
          podman pull ghcr.io/butrejp/butrelinux:latest
          container_id=$(podman create ghcr.io/butrejp/butrelinux:latest)
          podman cp $container_id:/ostree/repo/. /ostree-repo/
          podman rm $container_id

      - name: Write Kickstart
        run: |-
          cat > butrelinux.ks << 'EOF'
          #version=RHEL10
          lang en_US.UTF-8
          keyboard us
          timezone UTC --isUtc
          skipx
          network --bootproto=dhcp --device=link --activate
          network --hostname=localhost.localdomain
          bootloader --location=mbr --boot-drive=sda
          ostreesetup --nogpg --url=file:///ostree-repo --ref=butrelinux/lts/x86_64 --unified-core
          %packages
          %end
          %post
          passwd -d root
          systemctl enable sshd
          %end
          reboot
          EOF

      - name: Build ISO
        run: |
          mkdir -p /tmp/iso-build
          livemedia-creator \
            --make-iso \
            --no-virt \
            --ks butrelinux.ks \
            --iso-name butrelinux-installer.iso \
            --tmp /tmp/iso-build \
            --logfile /tmp/iso-build.log \
            --resultdir ./results

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: butrelinux-iso
          path: ./results/butrelinux-installer.iso
          retention-days: 14
          if-no-files-found: error
