name: Build ButreLinux ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build ISO with bootc-image-builder
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          mkdir -p $GITHUB_WORKSPACE/containers/storage
          docker run --rm --privileged \
            -v $GITHUB_WORKSPACE/output:/output \
            -v $GITHUB_WORKSPACE/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --target-arch x86_64 \
            ghcr.io/butrejp/butrelinux:latest

      - name: Locate built ISO
        run: |
          echo "Output directory contents:"
          find $GITHUB_WORKSPACE/output -type f -ls || true
          mkdir -p ./results
          find $GITHUB_WORKSPACE/output -name "*.iso" -exec cp {} ./results/butrelinux-installer.iso \;

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: butrelinux-iso
          path: ./results/butrelinux-installer.iso
          retention-days: 14
          if-no-files-found: error
