name: Build ButreLinux ISO

on:
  workflow_dispatch:  # Manual trigger from Actions tab

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repo (needed if you have other files)
      - name: Checkout repo
        uses: actions/checkout@v6

      # Step 2: Create the libdir template inside the working directory
      - name: Create libdir template
        run: |
          echo '<%\nlibdir = "/usr/lib64"\n%>' > set-libdir.tmpl

      # Step 3: Build the ISO using build-container-installer
      - name: Build ISO
        uses: jasonn3/build-container-installer@main
        id: build
        with:
          arch: x86_64
          image_name: butrelinux
          image_repo: ghcr.io/butrejp
          image_tag: latest
          version: 42
          variant: workstation
          iso_name: butrelinux-installer.iso
          additional_templates: "set-libdir.tmpl"
          # enrollment_password: universalblue  # Uncomment if secure boot
          # secure_boot_key_url: https://github.com/ublue-os/bazzite/raw/main/secure_boot.der

      # Step 4: Upload the ISO as an artifact
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: butrelinux-iso
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          retention-days: 14
          if-no-files-found: error
