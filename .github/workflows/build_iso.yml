name: Build ButreLinux ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Prepare directories and config
        run: |
          sudo mkdir -p /var/lib/containers/storage
          sudo chmod 755 /var/lib/containers/storage
          mkdir -p $GITHUB_WORKSPACE/output

          # Create config.toml with empty kickstart so Anaconda runs interactively
          cat > $GITHUB_WORKSPACE/config.toml << 'EOF'
          [customizations.installer.kickstart]
          contents = """
          graphical
          """
          EOF

      - name: Pull image into local podman storage
        run: |
          sudo podman pull ghcr.io/butrejp/butrelinux:latest

      - name: Build ISO with bootc-image-builder
        run: |
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v $GITHUB_WORKSPACE/output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v $GITHUB_WORKSPACE/config.toml:/config.toml \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --target-arch x86_64 \
            --config /config.toml \
            ghcr.io/butrejp/butrelinux:latest

      - name: Fix output permissions
        run: |
          sudo chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE/output

      - name: Locate built ISO
        run: |
          echo "Output directory contents:"
          find $GITHUB_WORKSPACE/output -type f -ls || true
          mkdir -p ./results
          find $GITHUB_WORKSPACE/output -name "*.iso" -exec cp {} ./results/butrelinux-installer.iso \;

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: butrelinux-iso
          path: ./results/butrelinux-installer.iso
          retention-days: 14
          if-no-files-found: error
