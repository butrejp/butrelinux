name: Build ButreLinux ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream-10
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          dnf -y install epel-release
          dnf -y install podman skopeo rpm-ostree livemedia-creator lorax createrepo_c sudo passwd shadow-utils systemd
          dnf clean all

      - name: Extract OSTree repo from container image
        run: |
          mkdir -p /ostree-repo
          podman pull ghcr.io/butrejp/butrelinux:latest
          container_id=$(podman create ghcr.io/butrejp/butrelinux:latest)
          # Only copy the ostree repo (usually under /ostree/repo)
          podman cp $container_id:/ostree/repo/. /ostree-repo/
          podman rm $container_id

      # Step 4: Write generic Kickstart
      - name: Write Kickstart
        run: |
          cat > butrelinux.ks << 'EOF'
#version=RHEL10
lang en_US.UTF-8
keyboard us
timezone UTC --isUtc
skipx
network --bootproto=dhcp --device=link --activate
network --hostname=localhost.localdomain
bootloader --location=mbr --boot-drive=sda
ostreesetup --nogpg --url=file:///ostree-repo --ref=butrelinux/lts/x86_64 --unified-core
%packages
%end
%post
passwd -d root
systemctl enable sshd
%end
reboot
EOF

      # Step 5: Build ISO
      - name: Build ISO
        run: |
          mkdir -p /tmp/iso-build
          livemedia-creator \
            --make-iso \
            --ks butrelinux.ks \
            --iso-name butrelinux-installer.iso \
            --tmp /tmp/iso-build \
            --logfile /tmp/iso-build.log \
            --resultdir ./results \
            --image-repo /ostree-repo

      # Step 6: Upload ISO
      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: butrelinux-iso
          path: ./results/butrelinux-installer.iso
          retention-days: 14
          if-no-files-found: error
