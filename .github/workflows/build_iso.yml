name: Build ButreLinux ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Prepare directories
        run: |
          sudo mkdir -p /var/lib/containers/storage
          sudo chmod 755 /var/lib/containers/storage
          mkdir -p $GITHUB_WORKSPACE/output

      - name: Pull image and fix os-release for bib
        run: |
          # Pull into local podman storage
          sudo podman pull ghcr.io/butrejp/butrelinux:latest

          # bib derives the distro def from ID+VERSION_ID in /etc/os-release.
          # Since "butrelinux" isn't known, temporarily spoof it back to the
          # base distro (centos for CentOS Stream 10; use "rhel" if based on RHEL).
          sudo podman create --name butrelinux-tmp \
            --entrypoint /bin/sh \
            ghcr.io/butrejp/butrelinux:latest \
            -c "sed -i 's/^ID=.*/ID=centos/' /etc/os-release && \
                sed -i 's/^NAME=.*/NAME=\"CentOS Stream\"/' /etc/os-release && \
                sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME=\"CentOS Stream 10\"/' /etc/os-release"

          sudo podman start butrelinux-tmp
          sudo podman wait butrelinux-tmp
          sudo podman commit butrelinux-tmp localhost/butrelinux-fixed:latest
          sudo podman rm butrelinux-tmp

      - name: Build ISO with bootc-image-builder
        run: |
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v $GITHUB_WORKSPACE/output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --target-arch x86_64 \
            localhost/butrelinux-fixed:latest

      - name: Fix output permissions
        run: |
          sudo chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE/output

      - name: Locate built ISO
        run: |
          echo "Output directory contents:"
          find $GITHUB_WORKSPACE/output -type f -ls || true
          mkdir -p ./results
          find $GITHUB_WORKSPACE/output -name "*.iso" -exec cp {} ./results/butrelinux-installer.iso \;

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: butrelinux-iso
          path: ./results/butrelinux-installer.iso
          retention-days: 14
          if-no-files-found: error
