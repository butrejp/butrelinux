name: Build ButreLinux ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream10
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install podman
        run: |
          dnf -y install epel-release
          dnf -y install podman
          dnf clean all

      - name: Prepare container storage (tmpfs)
        run: |
          mkdir -p /var/lib/containers
          mount -t tmpfs -o size=30G tmpfs /var/lib/containers

      - name: Build ISO with bootc-image-builder
        run: |
          mkdir -p /output
          podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --target-arch x86_64 \
            ghcr.io/butrejp/butrelinux:latest

      - name: Locate built ISO
        run: |
          echo "Output directory contents:"
          find /output -type f -ls || true
          mkdir -p ./results
          find /output -name "*.iso" -exec cp {} ./results/butrelinux-installer.iso \;

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: butrelinux-iso
          path: ./results/butrelinux-installer.iso
          retention-days: 14
          if-no-files-found: error
