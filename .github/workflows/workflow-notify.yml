name: Fluxer Workflow Notifications

on:
  workflow_run:
    workflows:
      - "build butrelinux mainline images"
      - "Build Butrelinux ISO"
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    permissions:
      actions: read

    steps:
      - name: Send workflow result
        env:
          FLUXER_WEBHOOK: ${{ secrets.FLUXER_WEBHOOK }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          
          result = os.environ["RESULT"]
          if result == "failure":
              title = "❌ Workflow failed"
              color = 15548997
          else:
              title = "✅ Workflow succeeded"
              color = 5763719
              
          body = {
              "embeds": [{
                  "title": title,
                  "description": f"**{os.environ['WORKFLOW']}**\nBranch: `{os.environ['BRANCH']}`",
                  "url": os.environ["URL"],
                  "color": color
              }]
          }
          req = urllib.request.Request(
              os.environ["FLUXER_WEBHOOK"],
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json"}
          )
          urllib.request.urlopen(req)
          PY
