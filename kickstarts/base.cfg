graphical
network --bootproto=dhcp --device=link --activate --hostname butrelinux

%addon com_redhat_kdump --disable
%end

ostreecontainer --url=ghcr.io/butrejp/butrelinux-@IMAGE@:latest

%post --erroronfail
systemctl mask kdump.service

if command -v grubby > /dev/null; then
    grubby --update-kernel=ALL --remove-args="crashkernel" || true
fi
sed -i 's/crashkernel=[^ ]*//g' /etc/default/grub || true
bootc switch --mutate-in-place --enforce-container-sigpolicy ghcr.io/butrejp/butrelinux-@IMAGE@:latest
groupadd -f plugdev
%end
