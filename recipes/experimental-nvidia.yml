# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: butrelinux-experimental-nvidia
description: Bluefin LTS HWE with KDE Plasma (Nvidia)
base-image: ghcr.io/projectbluefin/bluefin-lts
image-version: stable

modules:
  - from-file: common.yml
  
  - type: dnf
    install:
      packages:
        - nvtop


  - type: script
    scripts:
      - image-info-nvidia.sh

  - type: custom-kernel
    source: local
    kernel: cachyos-lto
    initramfs: true
    nvidia: true
  
  - type: soar
  - type: signing
  