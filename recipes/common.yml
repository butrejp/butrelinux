# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      - dnf config-manager --set-enabled crb
      - chmod +x /usr/bin/givemethekeys

  - type: dnf
    remove:
      packages:
        - mutter
        - mutter-common
        - gnome-shell-common
        - gnome-settings-daemon
        - gnome-control-center-filesystem
        - gnome-tour
        - gnome-user-docs
        - gnome-remote-desktop
        - nautilus-extensions
        - xdg-desktop-portal-gnome
        - gnome50-el10-compat
        - tecla
        - gjs
        - gnome-bluetooth
        - gnome-bluetooth-libs
        - gnome-keyring
        - gnome-keyring-pam
        - gnome-online-accounts
        - gnome-online-accounts-libs
        - gnome-menus
        - gnome-desktop4
        - gnome-initial-setup
        - gnome-session-wayland-session
        - gnome-session
        - gnome-shell
        - gnome-color-manager
        - gnome-disk-utility
        - gdm
        - gnome-control-center
        - nautilus
        - ptyxis

    install:
      packages:
        - jetbrains-mono-fonts-all
        - kde-partitionmanager
        - krfb
        - krdc
        - khelpcenter
        - policycoreutils
        - policycoreutils-python-utils
        - policycoreutils-devel
        - selinux-policy-targeted
        - libsemanage
        - plasma-desktop
        - plasma-workspace-wayland
        - kde-settings-plasma
        - flatpak-kcm
        - kscreen
        - kinfocenter
        - sddm
        - sddm-kcm
        - sddm-breeze
        - polkit-kde
        - plasma-nm
        - plasma-disks
        - plasma-browser-integration
        - kde-connect
        - bluedevil
        - dolphin
        - kate
        - konsole
        - kio-admin
        - ark
        - spectacle
        - okular
        - plasma-systemmonitor
        - kde-gtk-config
        - kcalc
        - fastfetch
        - micro
        - btop
        - htop
        - xdg-desktop-portal-kde
        - firefox
        - powerdevil
        - tuned
        - tuned-ppd
        - tuned-profiles-atomic
        - lm_sensors
        
  - type: kargs
    kargs:
      - amdgpu.ppfeaturemask=0xffffffff
      - acpi_backlight=vendor
      - split_lock_detect=off

  - type: systemd
    system:
      enabled:
        - sddm.service
        - tuned.service
        - tuned-ppd.service
      disabled:
        - gdm.service
      masked:
        - rechunker-group-fix.service
        - systemd-oomd.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          url: https://flathub.org/beta-repo/flathub-beta.flatpakrepo
          name: flathub-beta
          title: Flathub Beta
        install:
          - org.kde.discover

  - type: fedora-rpm
    source: local
    releasever: "44"
    repos:
      - https://copr.fedorainfracloud.org/coprs/theblackdon/dcli-bootc/repo/fedora-44/theblackdon-dcli-bootc-fedora-44.repo
    install:
      - dcli-bootc

  - type: soar
