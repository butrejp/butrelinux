#this doesn't do anything yet.  I need to find an example of a recipe that uses a common file before implementing.

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      - dnf config-manager --set-enabled crb

  - type: dnf
    remove:
      packages:
        - gnome-initial-setup
        - gnome-session-wayland-session
        - gnome-session
        - gnome-shell
        - gnome-color-manager
        - gnome-disk-utility
        - gdm
        - gnome-control-center
        - nautilus
        - ptyxis
    install:
      packages:
        - policycoreutils
        - policycoreutils-python-utils
        - policycoreutils-devel
        - selinux-policy-targeted
        - libsemanage


        - plasma-desktop
        - plasma-workspace-wayland
        - kde-settings-plasma
        - kscreen
        - kinfocenter
        - sddm
        - sddm-kcm
        - sddm-breeze
        - polkit-kde
        - plasma-nm
        - plasma-disks
        - plasma-browser-integration
        - kde-connect
        - bluedevil

        - dolphin
        - kate
        - konsole
        - kio-admin
        - ark
        - spectacle
        - okular
        - plasma-systemmonitor
        - kde-gtk-config
        - kcalc

        - fastfetch
        - micro
        - btop
        - xdg-desktop-portal-kde
        - firefox

        - powerdevil
        - tuned
        - tuned-ppd
        - tuned-profiles-atomic
        - lm_sensors

  - type: kargs
    kargs:
      - amdgpu.ppfeaturemask=0xffffffff
      - acpi_backlight=vendor
      - split_lock_detect=off

  - type: systemd
    system:
      enabled:
        - sddm.service
        - tuned.service
        - tuned-ppd.service
      disabled:
        - gdm.service


  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          url: https://flathub.org/beta-repo/flathub-beta.flatpakrepo
          name: flathub-beta
          title: Flathub Beta
        install:
          - org.kde.discover:beta
