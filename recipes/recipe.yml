# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: butrelinux
description: Bluefin-GDX with KDE Plasma
base-image: ghcr.io/ublue-os/bluefin-gdx
image-version: lts

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      - dnf config-manager --set-enabled crb
      - dnf config-manager --add-repo=https://negativo17.org/repos/epel-negativo17.repo
      - dnf install epel-release -y
      - dnf install --setopt=localpkg_gpgcheck=1 https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-44.noarch.rpm

  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - steam
    remove:
      packages:
        # Core GNOME components
        - gnome-initial-setup
        - gnome-session-wayland-session
        - gnome-session
        - gnome-shell
        - gnome-color-manager
        - gnome-disk-utility
        - gdm
        - gnome-control-center
        - nautilus
        - ptyxis

  - type: rpm-ostree
    install:
      # SELinux/policy utils
      - policycoreutils
      - policycoreutils-python-utils
      - policycoreutils-devel
      - selinux-policy-targeted
      - libsemanage

      # Core Plasma desktop environment
      - plasma-desktop
      - plasma-workspace-wayland
      - kde-settings-plasma
      - kscreen
      - kinfocenter
      - sddm
      - sddm-kcm
      - sddm-breeze
      - polkit-kde
      - plasma-nm
      - plasma-disks
      - plasma-browser-integration
      - kde-connect
      - bluedevil

      - dolphin
      - kate
      - konsole
      - kio-admin
      - ark
      - spectacle
      - okular
      - plasma-systemmonitor
      - kde-gtk-config
      - kcalc

      - fastfetch
      - micro
      - btop
      - nvtop
      - xdg-desktop-portal-kde
      - firefox

      - powerdevil
      - tuned
      - tuned-ppd
      - tuned-profiles-atomic
      - lm_sensors

  # Fix for tuned-ppd log permissions bug (Bluefin-LTS issue #841)
  # trying tmpfiles method
  - type: script
    snippets:
      - |
        mkdir -p /usr/lib/tmpfiles.d
        echo 'd /var/log/tuned 0755 root root -' > /usr/lib/tmpfiles.d/tuned-ppd.conf
        echo 'f /var/log/tuned/tuned-ppd.log 0644 root root -' >> /usr/lib/tmpfiles.d/tuned-ppd.conf
#  - type: script
#    snippets:
#      - |
#        mkdir -p /var/log/tuned
#        chmod 755 /var/log/tuned
#        touch /var/log/tuned/tuned-ppd.log
#        chmod 644 /var/log/tuned/tuned-ppd.log

  - type: kargs
    kargs:
      - nvidia-drm.modeset=1
      - nvidia.NVreg_PreserveVideoMemoryAllocations=1
      - rd.driver.blacklist=nouveau
      - modprobe.blacklist=nouveau
      - amdgpu.ppfeaturemask=0xffffffff
      - acpi_backlight=vendor
      - split_lock_detect=off

  - type: systemd
    system:
      enabled:
        - sddm.service
        - tuned.service
        - tuned-ppd.service
      disabled:
        - gdm.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          url: https://flathub.org/beta-repo/flathub-beta.flatpakrepo
          name: flathub-beta
          title: Flathub Beta
        install:
          - org.kde.discover:beta

  - type: script
    scripts:
      - image-info.sh
  
  - type: containerfile          # mark for deletion
    snippets:
      - ADD https://github.com/srevinsaju/zap/releases/download/continuous/zap-amd64 /usr/local/bin/zap
      - RUN chmod +x /usr/local/bin/zap

  - type: soar


  # environment overrides for steam
  - type: script
    snippets:
      - |
        flatpak override --system --env=__NV_PRIME_RENDER_OFFLOAD=1 \
          --env=__VK_LAYER_NV_optimus=NVIDIA_only \
          --env=__GLX_VENDOR_LIBRARY_NAME=nvidia \
          com.valvesoftware.Steam

  - type: signing
