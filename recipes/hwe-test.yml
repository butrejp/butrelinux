# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: butrelinux-hwe-testing
description: Bluefin LTS HWE with KDE Plasma (Intel/AMD)
base-image: ghcr.io/projectbluefin/bluefin-lts-hwe
image-version: testing

modules:
  - from-file: common.yml
  
  - type: dnf
    repos:
      copr:
        - name: theblackdon/dcli-bootc
          chroot: fedora-44-x86_64

  - type: script
    scripts:
      - image-info-hwe.sh
  
  - type: soar
  - type: signing
