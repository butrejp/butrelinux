# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: butrelinux-nvidia
description: Bluefin LTS HWE with KDE Plasma (Nvidia)
base-image: ghcr.io/projectbluefin/bluefin-lts-hwe-nvidia
image-version: stable

modules:
  - from-file: common.yml

  - type: dnf
    install:
      packages:
        - nvtop

  - type: script
    scripts:
      - image-info-nvidia.sh

  - type: soar
  - type: signing
  