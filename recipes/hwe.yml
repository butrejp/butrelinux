# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: butrelinux-hwe
description: Bluefin LTS HWE with KDE Plasma (Intel/AMD)
base-image: ghcr.io/projectbluefin/bluefin-lts-hwe
image-version: stable

modules:
  - from-file: common.yml
  
  - type: butre-image-info
    source: local
    variant: hwe

  - type: custom-kernel
    source: local
    kernel: cachyos-lto
    initramfs: true
    zfs: true
    nvidia: false

  - from-file: end.yml