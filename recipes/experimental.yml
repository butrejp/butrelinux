# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: butrelinux-experimental
description: Butrelinux Experimental
base-image: ghcr.io/projectbluefin/bluefin-lts-hwe
image-version: stable

modules:
  - from-file: common.yml
  - from-file: lto.yml
  
  - type: butre-image-info
    source: local
    variant: experimental

  - type: custom-kernel-experimental
    source: local
    initramfs: true
    zfs: true
    nvidia: false

  - from-file: end.yml
  