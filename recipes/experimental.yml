# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: butrelinux-experimental
description: Bluefin LTS HWE with KDE Plasma (Intel/AMD)
base-image: ghcr.io/projectbluefin/bluefin-lts
image-version: stable

modules:
  - from-file: common.yml
  - type: dnf
    remove:
      packages:
        - zfs
        - libnvpair3
        - libzfs7
        - kmod-zfs
        - python3-pyzfs
        - kernel-headers
        - kernel-tools
        - kernel-tools-libs
        
  - type: script
    scripts:
      - image-info-hwe.sh

  - type: custom-kernel
    source: local
    kernel: cachyos-lto
    initramfs: true
    zfs: true

  - from-file: end.yml
